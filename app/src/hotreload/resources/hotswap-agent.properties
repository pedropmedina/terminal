# Reload updated class files without requiring a debugger or IDE integration.
autoHotswap=true

# Discover the small project plugin that redraws live application charts after a class reload.
pluginPackages=com.emulator.app.hotreload

# Make edited development resources visible through the application classloader.
# Existing JavaFX scenes still need to be reconstructed to reflect structural FXML changes.
watchResources=src/main/resources
